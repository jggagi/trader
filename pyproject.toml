[project]
name = "market-lens"
version = "0.1.0"
description = "Local-first market attribution and master critique Streamlit system."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.0.0",
    "plotly>=5.20.0",
    "pydantic>=2.6.0",
    "requests>=2.31.0",
    "streamlit>=1.34.0",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
